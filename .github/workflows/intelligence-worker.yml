name: Intelligence Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase intelligence job ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: intelligence-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Dify intelligence workflow
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIFY_INTELLIGENCE_API_URL: ${{ secrets.DIFY_INTELLIGENCE_API_URL }}
          DIFY_INTELLIGENCE_API_KEY: ${{ secrets.DIFY_INTELLIGENCE_API_KEY }}
        run: node scripts/intelligence-worker.mjs
