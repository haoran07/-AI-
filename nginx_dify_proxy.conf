# ===== AI 客服中转：前端调 /api/dify/chat-messages，nginx 转发到 Dify 并注入 API Key =====
# 把下面这个 location 块，加进你「haoxixi.com.cn 网站的 server { }」里面（和其它 location 平级）
# 位置：通常在 /etc/nginx/conf.d/ 或 /etc/nginx/sites-available/ 下你网站对应的配置文件里

location /api/dify/ {
    proxy_pass https://dify.haoxixi.com.cn/v1/;
    proxy_http_version 1.1;

    # Host 必须指向 Dify 域名，否则 Dify 的 nginx 无法正确路由
    proxy_set_header Host dify.haoxixi.com.cn;

    # 关键：API Key 只在这里（服务器端），前端看不到
    proxy_set_header Authorization "Bearer app-WPXUNUnS2rnK7RCyXqtcUKK0";

    # 流式输出（打字机）必需：关闭缓冲，保持长连接
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
